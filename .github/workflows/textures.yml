name: Rebuild Textures.xbt

# 用 Kodi 22 (Piers) 的 TexturePacker V3 把 media/ 下的散图重建为 media/Textures.xbt。
#
# 触发时机：
#   1. media/ 下有图片增删改（例如合并上游后新增贴图）—— 自动重建
#   2. 手动 workflow_dispatch
#
# 说明：
#   - 打包器由 .github/scripts/install-texturepacker-v3.sh 从固定 Kodi 提交源码编译，
#     产出 XBTF3（v3）。Ubuntu 自带的 kodi-tools-texturepacker 是 Kodi 20.5 / XBT v2，不用。
#   - media/ 只有 Textures.xbt、没有散图时直接跳过，不重新打包。
#   - 发布包由 release.yml 现场打包；本流程只负责让仓库里的 Textures.xbt 保持同步。
#   - 提交带 [skip ci]，且 paths 排除 Textures.xbt 本身，避免自我触发死循环。

on:
  workflow_dispatch:
  push:
    branches:
      - douban-piers
    paths:
      - 'media/**'
      - '!media/Textures.xbt'
      - '.github/workflows/textures.yml'
      - '.github/scripts/install-texturepacker-v3.sh'

permissions:
  contents: write

concurrency:
  group: textures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check loose textures
        id: check
        run: |
          set -euo pipefail
          COUNT="$(find media -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) | wc -l)"
          echo "loose=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "media/ 散图: ${COUNT} 张"
          if [ "${COUNT}" -eq 0 ]; then
            echo "media/ 仅含 Textures.xbt，无需重建"
          fi

      - name: Install TexturePacker V3 (Kodi 22)
        if: steps.check.outputs.loose != '0'
        run: bash .github/scripts/install-texturepacker-v3.sh

      - name: Rebuild Textures.xbt
        if: steps.check.outputs.loose != '0'
        run: |
          set -euo pipefail
          echo "散图数量: $(find media -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) | wc -l)"
          cd media
          kodi-TexturePacker-v3 -dupecheck -input . -output Textures.xbt
          cd ..

          ls -l media/Textures.xbt

          # 头部必须是 XBTF3（Kodi 22 / XBT v3）
          if [ "$(head -c 5 media/Textures.xbt)" != "XBTF3" ]; then
            echo "::error::生成的 Textures.xbt 头部不是 XBTF3"
            exit 1
          fi

      - name: Verify every texture is bundled
        if: steps.check.outputs.loose != '0'
        run: |
          set -euo pipefail
          # XBTF 内部按内容去重（-dupecheck），同一张图只保留一个名字。
          # 因此不能按文件名判断，要按 md5 判断"这份内容是否已被包内某个名字代表"。
          find media -type f -name '*.png' | sed 's|^media/||' | sort -u > /tmp/expected.txt
          grep -a -o -F -f /tmp/expected.txt media/Textures.xbt | sort -u > /tmp/found.txt || true

          # 每行格式：<32位md5><空格><路径>
          ( cd media && find . -type f -name '*.png' -exec md5sum {} + ) \
            | sed -E 's|^([0-9a-f]{32}) [ *]\./|\1  |' > /tmp/hashes.txt

          # 已覆盖的内容 = 名字出现在包内的那些文件的 md5
          awk 'NR==FNR{ok[$0];next} {p=substr($0,35); if(p in ok) print substr($0,1,32)}' \
            /tmp/found.txt /tmp/hashes.txt | sort -u > /tmp/covered.txt

          # 内容未被任何包内文件代表的，才是真正没打进包的
          awk 'NR==FNR{c[$0];next} {if(!(substr($0,1,32) in c)) print substr($0,35)}' \
            /tmp/covered.txt /tmp/hashes.txt | sort > /tmp/missing.txt

          total=$(wc -l < /tmp/hashes.txt)
          unique=$(cut -c1-32 /tmp/hashes.txt | sort -u | wc -l)
          covered=$(wc -l < /tmp/covered.txt)
          missing=$(wc -l < /tmp/missing.txt)
          echo "散图 ${total} 张 / 唯一内容 ${unique} 种 / 已打包 ${covered} 种 / 未打包 ${missing} 张"

          if [ "$missing" -gt 0 ]; then
            echo "::warning::${missing} 张图未打进 Textures.xbt（运行时回退为散图加载）"
            head -n 30 /tmp/missing.txt
          fi

      - name: Commit
        if: steps.check.outputs.loose != '0'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/Textures.xbt
          if git diff --cached --quiet; then
            echo "纹理包无变化，跳过提交"
            exit 0
          fi
          git commit -m ":bento: Rebuild Textures.xbt (XBT v3) [skip ci]"
          git push
