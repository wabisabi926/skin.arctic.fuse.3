name: Build Kodi Addon Release

# 版本号更新（addon.xml 变更）时自动打包并发布到 GitHub Releases。
# media/ 有散图时用 Kodi 22 TexturePacker V3 现场打包；只有 Textures.xbt 时直接复用。
# 发布包内 media/ 仅保留 Textures.xbt。
on:
  push:
    branches:
      - douban-piers
    paths:
      - addon.xml
  workflow_dispatch:
    inputs:
      validate:
        description: '仅构建并校验 V3 纹理打包，不发布 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: kodi-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read addon version
        id: meta
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('addon.xml').getroot().get('version'))")"
          if [ -z "${VERSION}" ]; then
            echo "Could not read version from addon.xml" >&2
            exit 1
          fi
          BRANCH="${GITHUB_REF_NAME}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${BRANCH}-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=skin.arctic.fuse.3-${BRANCH}-${VERSION}.zip" >> "$GITHUB_OUTPUT"
          echo "Addon version: ${VERSION} (branch: ${BRANCH})"

      - name: Build release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="${{ steps.meta.outputs.tag }}"
          BODY="$RUNNER_TEMP/release-body.md"

          # CHANGELOG.md is the single source of truth; fail early if the
          # version section is missing so an empty release never ships.
          python3 .github/scripts/extract_changelog.py "$VERSION" > "$BODY"

          printf '\n\n---\n\n<details>\n<summary>完整提交与 PR 列表</summary>\n\n' >> "$BODY"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq '.body' >> "$BODY" 2>/dev/null; then
            printf '\n' >> "$BODY"
          else
            printf '自动生成明细失败，请查看 Actions 运行记录。\n' >> "$BODY"
          fi
          printf '</details>\n' >> "$BODY"

          echo "body_path=$BODY" >> "$GITHUB_OUTPUT"
          echo "=== release body preview ==="
          head -n 30 "$BODY"

      - name: Check whether release already exists
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.validate || 'false' }}" = "true" ]; then
            # 校验模式：强制构建 zip 以验证 V3 打包，但不发布
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Validate mode - build only, no publish."
          elif gh release view "${{ steps.meta.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.meta.outputs.tag }} already exists - skip."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect media textures
        id: textures
        if: steps.guard.outputs.exists == 'false'
        run: |
          set -euo pipefail
          COUNT="$(find media -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) | wc -l)"
          echo "loose=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "media/ 散图: ${COUNT} 张"

      - name: Install TexturePacker V3 (Kodi 22)
        if: steps.guard.outputs.exists == 'false' && steps.textures.outputs.loose != '0'
        run: bash .github/scripts/install-texturepacker-v3.sh

      - name: Build addon zip
        id: build
        if: steps.guard.outputs.exists == 'false'
        run: |
          set -euo pipefail
          ADDON_ID="skin.arctic.fuse.3"
          VERSION="${{ steps.meta.outputs.version }}"
          BRANCH="${{ steps.meta.outputs.branch }}"
          BUILD_DIR="${RUNNER_TEMP}/build"
          ZIP_PATH="${RUNNER_TEMP}/${ADDON_ID}-${BRANCH}-${VERSION}.zip"

          mkdir -p "${BUILD_DIR}/${ADDON_ID}"

          # 复制整个插件目录，排除 VCS / CI 元数据(*.gitattributes、*.gitignore)
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitattributes' \
            --exclude='.gitignore' \
            ./ "${BUILD_DIR}/${ADDON_ID}/"

          MEDIA="${BUILD_DIR}/${ADDON_ID}/media"
          LOOSE="${{ steps.textures.outputs.loose || '0' }}"

          if [ "${LOOSE}" -gt 0 ]; then
            # 有散图：只用 Kodi 22 的 TexturePacker V3 现场打包，产物仅 Textures.xbt
            INPUT="${RUNNER_TEMP}/tp-input"
            rm -rf "${INPUT}" && mkdir -p "${INPUT}"
            ( cd "${MEDIA}" && find . -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) \
                -exec cp --parents '{}' "${INPUT}" \; )
            kodi-TexturePacker-v3 -dupecheck -input "${INPUT}/" -output "${MEDIA}/Textures.xbt"
            if [ "$(head -c 5 "${MEDIA}/Textures.xbt")" != "XBTF3" ]; then
              echo "::error::Textures.xbt 头部不是 XBTF3（非 XBT v3）"
              exit 1
            fi
            echo "TexturePacker V3 已打包 $(find "${INPUT}" -type f | wc -l) 张散图"
          else
            # media/ 本身只有 Textures.xbt：直接复用，不重新打包
            if [ ! -f "${MEDIA}/Textures.xbt" ]; then
              echo "::error::media/ 既无散图也无 Textures.xbt"
              exit 1
            fi
            echo "media/ 无散图，复用现成 Textures.xbt，跳过纹理打包"
          fi

          # 散图不进发布包
          find "${MEDIA}" -mindepth 1 -type f -not -name 'Textures.xbt' -delete
          find "${MEDIA}" -mindepth 1 -type d -empty -delete

          # 以 skin.arctic.fuse.3/ 为 zip 根目录，命名 <addonid>-<branch>-<version>.zip
          ( cd "${BUILD_DIR}" && zip -rq "${ZIP_PATH}" "${ADDON_ID}" )

          echo "zip_path=${ZIP_PATH}" >> "$GITHUB_OUTPUT"
          echo "=== package contents (head) ==="
          unzip -l "${ZIP_PATH}" | head -n 30
          echo "=== media entries ==="
          unzip -l "${ZIP_PATH}" | grep -F "${ADDON_ID}/media/" || true

      - name: Publish GitHub Release
        if: steps.guard.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: ${{ steps.build.outputs.zip_path }}
          draft: false
          prerelease: false
